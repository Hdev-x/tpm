spring.application.name=tpm
# 어떤 properties 파일을 활성시킬껀지
spring.profiles.active=dev

server.port= 80

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

mybatis.configuration.map-underscore-to-camel-case=true
# -- mybatis.mapper-locations=classpath:database/mappers/*Mapper.xml -> mapper의 위치를 알려줌
# -- config 타입의 aliases를 대체    같은 class명이 존재 하면 에러 발생
mybatis.type-aliases-package=com.tj.app

mybatis.mapper-locations=classpath:com/tj/app/**/*.xml

#-- file 관리
#-- mulitipart 사용 여부 기본값 false
spring.servlet.multipart.enabled=true

#-- 파일 하나당 최대 크기 설정 제한
spring.servlet.multipart.max-file-size=10MB
#-- 총 파일의 최대 크기 설정 제한
spring.servlet.multipart.max-request-size=100MB

app.upload.base=C:\\Users\\a0109\\upload\\

#-- 외부(브라우저)에서 해당 경로의 파일에 접근할 수 있도록 **리소스 핸들러(Resource Handler)**를 등록할 때 사용합니다.
app.upload.path=file:\\C:\\Users\\a0109\\upload\\

#-- 브라우저 주소창에 입력할 가상 경로입니다
app.upload.url=/files/**

# -- aop 사용시
# -- 부모가 없는 class 사용시 부모가 없는 경우 에러 발생 방지
spring.aop.proxy-target-class=true

# -- Message 설정
spring.messages.basename=messages/message
spring.messages.encoding=UTF-8
# -- code가 없을때 에러 발생
# -- true : 예외를 발생 시키지 않고 key를 출력
# -- false : 예외를 발생 기본값 false
spring.messages.use-code-as-default-message=true

spring.messages.cache-duration=600